# Structured M(q), V(q) model of the double pendulum (Fig. 2), in f64.
x64 = true

[domain]
n_dof = 2

[lagrangian]
name = "double_pendulum"

[train]
arch = "structured"
n_points = 20000
amp_bound = 4.0
omega_bound = 8.0
n_steps = 200000
norm_weight = 0.1
mass_anchor = true
out = "dpendulum_structured.eqx"
