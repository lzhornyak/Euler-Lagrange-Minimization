[project]
name = "elm"
version = "1.0.0"
description = "Euler-Lagrange Minimization: variational integrators for learned Lagrangian ODEs and PDEs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["jax>=0.8.2", "equinox>=0.11", "numpy>=1.26", "optax>=0.2"]

[project.scripts]
elm = "elm.sim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
